name: CI

on:
  push:
    branches: [main, v2-streaming]
  pull_request:
    branches: [main, v2-streaming]

jobs:
  backend-base:
    name: Backend tests (base install, no ML deps)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/ -v
      - name: Run deterministic eval scorecard
        run: python eval/run_eval.py

  backend-ml:
    name: Backend tests (with ML layer)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-ml.txt pytest
      - run: python -m pytest tests/ -v

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
